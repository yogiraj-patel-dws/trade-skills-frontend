<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Material Symbols -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Tailwind Config -->
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              /* Primary */
              primary: "#2bee79",
              "primary-hover": "#25cf68",
              "primary-dark": "#052e16",

              /* Backgrounds */
              "background-light": "#f8fcfa",
              "background-dark": "#102217",
              "background-warm": "#fcfaf9",

              /* Surfaces */
              "surface-light": "#ffffff",
              "surface-dark": "#1a3324",
              "surface-card": "#ffffff",

              /* Text */
              "text-main": "#1c1917",
              "text-secondary": "#78716c",

              /* Borders & Inputs */
              "border-subtle": "#e7e5e4",
              "input-bg": "#fafaf9",

              /* Accent */
              "accent-bg": "#e7f3ec",
            },

            fontFamily: {
              /* Headings */
              display: ["Plus Jakarta Sans", "Lexend", "Manrope", "sans-serif"],

              /* Body */
              body: ["Noto Sans", "sans-serif"],
              sans: ["Manrope", "sans-serif"],
            },

            borderRadius: {
              DEFAULT: "1rem",
              lg: "1.5rem",
              xl: "2rem",
              "2xl": "2.5rem",
              full: "9999px",

              /* Semantic */
              card: "1.5rem",
              input: "1rem",
            },

            boxShadow: {
              soft: "0 10px 40px -10px rgba(0,0,0,0.05)",
              glow: "0 0 20px rgba(43,238,121,0.3)",
            },

            backgroundImage: {
              "warm-gradient":
                "linear-gradient(180deg, #fdfbf7 0%, #f7f5f2 100%)",
              "glass-gradient":
                "linear-gradient(145deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.6) 100%)",
            },

            accentColor: {
              DEFAULT: "#2bee79",
            },
          },
        },
      };
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>trade-skill-frontend</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
