<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Material Symbols -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Tailwind Config -->
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              /* Primary */
              primary: "#2bee79",
              "primary-hover": "#22c566",
              "primary-dark": "#052e16",

              /* Page / Backgrounds */
              "bg-page": "#f8fafc",
              "background-light": "#f8fcfa",
              "background-dark": "#102217",
              "background-warm": "#fcfaf9",

              /* Surfaces */
              surface: "#ffffff",
              "surface-light": "#ffffff",
              "surface-dark": "#1a3324",
              "surface-card": "#ffffff",

              /* Text */
              "text-main": "#0f172a",
              "text-secondary": "#78716c",
              "text-muted": "#64748b",

              /* Borders & Inputs */
              "border-light": "#e2e8f0",
              "border-subtle": "#e7e5e4",
              "input-bg": "#fafaf9",

              /* States */
              success: "#10b981",
              warning: "#f59e0b",

              /* Accent */
              "accent-bg": "#e7f3ec",
            },

            fontFamily: {
              /* Headings */
              display: ["Plus Jakarta Sans", "Lexend", "Manrope", "sans-serif"],

              /* Body */
              body: ["Noto Sans", "sans-serif"],
              sans: ["Manrope", "sans-serif"],
            },

            borderRadius: {
              DEFAULT: "0.5rem",
              lg: "0.75rem",
              xl: "1rem",
              "2xl": "1.5rem",
              "3xl": "2rem",
              full: "9999px",

              /* Semantic */
              card: "1.5rem",
              input: "1rem",
            },

            boxShadow: {
              soft: "0 4px 20px -2px rgba(0, 0, 0, 0.05)",
              "card-depth": "0 20px 40px -10px rgba(15, 23, 42, 0.2)",
              glow: "0 0 20px rgba(43,238,121,0.3)",
              "glow-primary": "0 0 20px rgba(43, 238, 121, 0.4)",
            },

            backgroundImage: {
              "warm-gradient":
                "linear-gradient(180deg, #fdfbf7 0%, #f7f5f2 100%)",
              "glass-gradient":
                "linear-gradient(145deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.6) 100%)",
            },

            accentColor: {
              DEFAULT: "#2bee79",
            },
          },
        },
      };
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>trade-skill-frontend</title>
  </head>

  <body class="bg-bg-page text-text-main font-body">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
